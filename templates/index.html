<!DOCTYPE html>
<html>
<head>
<title>Password Strength Analyzer</title>

<style>
body{
    font-family: Arial;
    background:#f4f6f9;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
    text-align:center;
}

input{
    padding:10px;
    width:250px;
    margin-top:10px;
}

button{
    padding:10px 20px;
    margin-top:15px;
    background:#007bff;
    color:white;
    border:none;
    border-radius:5px;
}

#strength{
    margin-top:15px;
    font-weight:bold;
}

.row{
    display: flex;
    align-items: center;
    gap: 10px;
}



</style>

</head>

<body>

<div class="container">

<h2>Password Strength Analyzer</h2>

<div class="row">
    <input type="password" id="password" placeholder="Enter Password">

    <label>
        <input type="checkbox" onclick="togglePassword()">
    </label>
</div>
<button onclick="checkPassword()">Check Strength</button>

<p id="strength"></p>

</div>

<script>

function togglePassword() {
    let x = document.getElementById("password");

    if (x.type === "password") {
        x.type = "text";
    } else {
        x.type = "password";
    }
}

function checkPassword(){

let password = document.getElementById("password").value;

let strength = "Weak";

if(password.length >= 8 &&
   /[A-Z]/.test(password) &&
   /[0-9]/.test(password) &&
   /[!@#$%^&*]/.test(password))
{
    strength = "Strong";
}
else if(password.length >=6)
{
    strength = "Medium";
}

document.getElementById("strength").innerText =
"Password Strength: " + strength;

}

</script>

</body>
</html>
